name: Import SPIEL games

# Rebuilds data/spiel-data.js from SPIEL's official novelty list and BoardGameGeek's
# SPIEL 2026 preview (tools/import-games.js) and commits the result to the branch it ran on.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - tools/import-games.js
      - .github/workflows/import-games.yml

permissions:
  contents: write

concurrency:
  group: import-games-${{ github.ref }}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import games
        run: node tools/import-games.js

      - name: Check seed data
        run: node -e "global.window={}; require('./data/spiel-data.js'); const s=window.SPIEL_SEED; if(!s||!s.members||!s.games) throw new Error('bad seed data'); const ids=new Set(s.games.map(g=>g.id)); if(ids.size!==s.games.length) throw new Error('duplicate ids'); console.log(s.games.length+' games')"

      - name: Commit
        run: |
          git diff --quiet data/spiel-data.js && { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/spiel-data.js
          git commit -m "Import SPIEL 2026 games (official list + BGG preview)"
          # The branch may have moved while the import ran
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
