name: Explore SPIEL website (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [tools/explore-spiel-site.sh, .github/workflows/explore-spiel-site.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/explore-spiel-site.sh
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add dev-snapshot && git commit -m "Temporary snapshot of SPIEL's official lists" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:${GITHUB_REF_NAME}
