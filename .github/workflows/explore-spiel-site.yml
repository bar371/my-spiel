name: Explore SPIEL website (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [tools/explore-spiel-site.sh, .github/workflows/explore-spiel-site.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/explore-spiel-site.sh
      - uses: actions/upload-artifact@v4
        with: { name: spiel-site, path: out/ }
